<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- doctor_detail.html -->
<div class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <!-- Doctor Header Info -->
        <div class="flex items-center gap-6 mb-8">
            <div class="w-24 h-24 bg-sky-100 rounded-full flex items-center justify-center text-sky-500 text-3xl font-bold">
                {{ doctor.user.first_name.0 }}
            </div>
            <div>
                <h1 class="text-3xl font-bold text-sky-900">{{ doctor.user.get_full_name }}</h1>
                <p class="text-lg text-sky-600">{{ doctor.specialty.title }}</p>
            </div>
        </div>

        <p class="text-slate-600 mb-8 leading-relaxed">
            {{ doctor.bio|default:"No bio available." }}
        </p>

        <!-- Action Buttons Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t pt-8">

            <!-- URL MARKER 1: Appointments App -->
            <a href="{% url 'appointments:doctor_shifts' doctor.pk %}"
               class="flex justify-center items-center gap-2 bg-sky-500 hover:bg-sky-600 text-white py-3 rounded-xl font-bold transition">
                <span>📅</span> Book Appointment
            </a>

            <!-- URL MARKER 2: Feedback App -->
            <a href="{% url 'feedback:doctor_reviews' doctor.pk %}"
               class="flex justify-center items-center gap-2 bg-white border-2 border-sky-500 text-sky-600 hover:bg-sky-50 py-3 rounded-xl font-bold transition">
                <span>💬</span> Patient Reviews
            </a>
        </div>
    </div>
</div>

</body>
</html>
