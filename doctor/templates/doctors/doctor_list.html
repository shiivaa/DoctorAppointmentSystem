<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- doctor_list.html -->
<div class="max-w-6xl mx-auto px-4 py-8 bg-slate-50">
    <h1 class="text-3xl font-bold text-sky-900 mb-8">Find Your Doctor</h1>

    <!-- Search & Filter Bar -->
    <form method="GET" action="{% url 'doctors:list' %}" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-wrap gap-4">
        <!-- URL NOTE: Form action points to doctors:list -->
        <input type="text" name="q" value="{{ q }}" placeholder="Search by name or specialty..." class="flex-grow p-2 border border-slate-300 rounded-lg">
        <button type="submit" class="bg-sky-500 hover:bg-sky-600 text-white px-6 py-2 rounded-lg font-medium transition">Search</button>
    </form>

    <!-- Doctor Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for doctor in page_obj %}
        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden hover:shadow-lg transition">
            <div class="p-5">
                <h2 class="text-xl font-semibold text-sky-900">{{ doctor.user.get_full_name }}</h2>
                <p class="text-slate-500 mb-4">{{ doctor.specialty.title }}</p>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm text-sky-600 font-bold">★ {{ doctor.avg_rating|default:"No ratings" }}</span>
                    <span class="text-sm font-medium">{{ doctor.visit_fee }} $</span>
                </div>

                <!-- URL MARKER: Points to detail page -->
                <a href="{% url 'doctors:detail' doctor.pk %}"
                   class="block text-center w-full bg-sky-50 text-sky-600 py-2 rounded-lg font-semibold hover:bg-sky-100 transition">
                    View Profile
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
