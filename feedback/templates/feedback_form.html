{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <h3 class="card-title mb-4">Submit Appointment Feedback</h3>
            
            <p class="text-muted">
                <strong>Doctor:</strong> Dr. {{ appointment.doctor }} | 
                <strong>Date:</strong> {{ appointment.date }}
            </p>
            
            <form method="post" novalidate>
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mt-3">
                    Submit Feedback
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
